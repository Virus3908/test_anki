<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kanji Writing Prototype</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app">
        <section class="practice">
            <div class="prompt">
                <p class="label">Значение</p>
                <h1 id="prompt-meaning"></h1>
                <p class="hint">Нарисуй кандзи в правильном порядке черт.</p>
            </div>

            <div class="board-wrap">
                <canvas id="drawing-board" width="420" height="420" aria-label="Поле для рисования кандзи"></canvas>
                <div class="board-guides" aria-hidden="true">
                    <span></span>
                    <span></span>
                </div>
            </div>

            <div class="toolbar">
                <button id="undo-button" type="button">Отменить</button>
                <button id="clear-button" type="button">Очистить</button>
                <button id="check-button" type="button">Проверить</button>
                <button id="flip-button" type="button">Перевернуть</button>
            </div>
        </section>

        <section id="answer" class="answer" hidden>
            <div class="kanji-row">
                <div id="answer-kanji-large" class="kanji"></div>
                <div>
                    <p class="label">Кандзи</p>
                    <h2 id="answer-kanji"></h2>
                    <p id="answer-onyomi"></p>
                    <p id="answer-kunyomi"></p>
                </div>
            </div>

            <div class="feedback">
                <h2>Проверка</h2>
                <ol id="feedback-list"></ol>
            </div>

            <div class="examples">
                <h2>Примеры</h2>
                <ul id="examples-list"></ul>
            </div>

            <div class="stroke-demo">
                <h2>Правильный порядок</h2>
                <svg id="stroke-demo-svg" viewBox="0 0 109 109" role="img" aria-label="Порядок черт"></svg>
            </div>
        </section>
    </main>

    <script src="../generated/kanji-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
